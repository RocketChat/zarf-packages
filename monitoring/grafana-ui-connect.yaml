apiVersion: v1
kind: Service
metadata:
  name: grafana-ui-connect
  namespace: monitoring
  labels:
    # Enables "zarf connect grafana-ui"
    zarf.dev/connect-name: grafana-ui
  annotations:
    zarf.dev/connect-description: "Expose Grafana web"
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
