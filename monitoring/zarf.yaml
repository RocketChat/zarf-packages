kind: ZarfPackageConfig
metadata:
  name: rocketchat-monitoring
  description: A basic stack with Prometheus and Grafana
  version: 0.0.10-z1

components:
  - name: monitoring
    required: true
    charts:
      - name: monitoring
        version: 0.0.10
        namespace: monitoring
        url: https://rocketchat.github.io/helm-charts
        releaseName: monitoring
        valuesFiles:
          - monitoring-values.yaml

    manifests:
      - name: grafana-ui-connect
        namespace: monitoring
        files:
          - grafana-ui-connect.yaml

    healthChecks:
      - name: monitoring-grafana
        namespace: monitoring
        apiVersion: apps/v1
        kind: Deployment
      - name: prometheus-monitoring-operator-prometheus
        namespace: monitoring
        apiVersion: apps/v1
        kind: StatefulSet
      - name: monitoring-loki
        namespace: monitoring
        apiVersion: apps/v1
        kind: StatefulSet

    images:
      - ghcr.io/grafana/grafana-operator:v5.18.0
      - quay.io/prometheus/node-exporter:v1.9.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.83.0
      - quay.io/prometheus-operator/prometheus-operator:v0.83.0
      - quay.io/prometheus/prometheus:v3.4.2
      - quay.io/thanos/thanos:v0.39.1
      - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.6.0
      - registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
      - docker.io/grafana/grafana:11.3.0
      - docker.io/grafana/loki:3.6.3
      - docker.io/kiwigrid/k8s-sidecar:1.30.9
      - docker.io/nginxinc/nginx-unprivileged:1.29-alpine
      - memcached:1.6.39-alpine
      - otel/opentelemetry-collector-contrib:0.143.0
      - prom/memcached-exporter:v0.15.4

variables:
  - name: MONITORING_STORAGECLASS_NAME
    description: "The StorageClass name"
    prompt: true
    default: longhorn
  - name: MONITORING_LOKI_RETENTION_PERIOD
    description: "Logs older than this period are automatically deleted by the compactor"
    prompt: true
    default: 15d
  - name: MONITORING_LOKI_PERSISTENCE_SIZE
    description: "The total disk space allocated for storing logs. Hint: Size=(Daily Raw Volume×Retention Days×0.15)+Safety Buffer (20%)"
    prompt: true
    default: 30Gi



