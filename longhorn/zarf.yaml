kind: ZarfPackageConfig
metadata:
  name: rocketchat-longhorn
  description: "Provides Longhorn and a migrate-registry component which 're-init' Zarf cluster with it"
  version: 1.10.1-z2

components:
  - name: longhorn
    required: true

    charts:
      - name: longhorn
        releaseName: longhorn
        namespace: longhorn-system
        url: https://charts.longhorn.io
        version: 1.10.1
        valuesFiles:
          - values.yaml

    manifests:
      - name: longhorn-ui-connect
        namespace: longhorn-system
        files:
          - longhorn-ui-connect.yaml

    images:
      - longhornio/backing-image-manager:v1.10.1
      - longhornio/longhorn-engine:v1.10.1
      - longhornio/longhorn-instance-manager:v1.10.1
      - longhornio/longhorn-manager:v1.10.1
      - longhornio/longhorn-share-manager:v1.10.1
      - longhornio/longhorn-ui:v1.10.1
      - longhornio/longhorn-cli:v1.10.1
      - longhornio/csi-attacher:v4.10.0-20251030
      - longhornio/csi-provisioner:v5.3.0-20251030
      - longhornio/csi-resizer:v1.14.0-20251030
      - longhornio/csi-snapshotter:v8.4.0-20251030
      - longhornio/csi-node-driver-registrar:v2.15.0-20251030
      - longhornio/livenessprobe:v2.17.0-20251030
      - longhornio/support-bundle-kit:v0.0.71

    healthChecks:
      - name: longhorn-manager
        namespace: longhorn-system
        apiVersion: apps/v1
        kind: DaemonSet
      - name: longhorn-csi-plugin
        namespace: longhorn-system
        apiVersion: apps/v1
        kind: DaemonSet
      - name: longhorn-ui
        namespace: longhorn-system
        apiVersion: apps/v1
        kind: Deployment

    actions:
      onDeploy:
        after:
          - description: "Wait for Longhorn StorageClass to be created"
            wait:
              cluster:
                kind: StorageClass
                name: longhorn

  - name: mongodb-storage-class
    required: true

    manifests:
      - name: longhorn-mongodb
        files:
          - longhorn-mongodb-sc.yaml

  - name: migrate-registry
    actions:
      onDeploy:
        after:
          - description: "Identify and unset the current default StorageClass"
            cmd: |
              CURRENT_DEFAULT=$(zarf tools kubectl get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}')

              if test -n "$CURRENT_DEFAULT" && test "$CURRENT_DEFAULT" != "longhorn"; then
                echo "Unsetting default status for: $CURRENT_DEFAULT"
                zarf tools kubectl patch storageclass $CURRENT_DEFAULT -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
              fi

          - description: "Ensure Longhorn is the default StorageClass"
            cmd: "zarf tools kubectl patch storageclass longhorn -p '{\"metadata\": {\"annotations\":{\"storageclass.kubernetes.io/is-default-class\":\"true\"}}}'"

          - description: "Migrate Registry"
            cmd: |
              REGISTRY_SC=$(zarf tools kubectl get pvc zarf-docker-registry -n zarf -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "none")

              if test "$REGISTRY_SC" != "longhorn"; then
                echo "Pivot required. Current StorageClass: $REGISTRY_SC"
                
                # Release the disk lock
                zarf tools kubectl scale deployment zarf-docker-registry -n zarf --replicas=0
                
                # Delete the "old" PVC
                zarf tools kubectl delete pvc zarf-docker-registry -n zarf

                # Re-init with longhorn
                zarf init --storage-class longhorn --confirm

                echo "Registry pivot complete. Storage is now managed by Longhorn. Please redo this deployment!!!"
              else
                echo "Registry already on Longhorn. No action taken."
              fi


