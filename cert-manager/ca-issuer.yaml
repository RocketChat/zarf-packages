# The "selfsigned-issuer" ClusterIssuer is used to issue the Root CA Certificate. 
# Then, "ca-issuer" ClusterIssuer is used to issue but also sign certificates using 
# the newly created Root CA Certificate, which is what you will use for future certificates 
# cluster-wide. More at  https://cert-manager.io/docs/configuration/selfsigned/
#
# Also, when a custom CA (ca-issuer's secret name) is defined keep this
# in mind: https://cert-manager.io/docs/configuration/ca/#important-information
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ###ZARF_VAR_CERTMANAGER_SELFSIGNED_CA_COMMON_NAME###
  secretName: root-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: ###ZARF_VAR_CERTMANAGER_CA_ISSUER_SECRET_NAME###
